<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="CAPTCHA Solver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0d2540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38f0c8"/>
      <stop offset="100%" stop-color="#5aa9ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="240" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="998.5" height="238.5" rx="18" fill="none" stroke="#22345c" stroke-width="1.5"/>

  <!-- decorative grid tiles -->
  <g opacity="0.16" fill="none" stroke="url(#accent)" stroke-width="2">
    <rect x="760" y="40" width="52" height="52" rx="8"/>
    <rect x="822" y="40" width="52" height="52" rx="8"/>
    <rect x="884" y="40" width="52" height="52" rx="8"/>
    <rect x="760" y="102" width="52" height="52" rx="8" stroke="#38f0c8"/>
    <rect x="822" y="102" width="52" height="52" rx="8"/>
    <rect x="884" y="102" width="52" height="52" rx="8"/>
    <rect x="760" y="164" width="52" height="52" rx="8"/>
    <rect x="822" y="164" width="52" height="52" rx="8"/>
    <rect x="884" y="164" width="52" height="52" rx="8"/>
  </g>

  <!-- title -->
  <text x="56" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="1">CAPTCHA<tspan fill="url(#accent)"> Solver</tspan></text>
  <text x="58" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9fb2d4">Text OCR + image-grid selection &#183; CPU-only &#183; no third-party services</text>

  <!-- stat pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="56" y="152" width="168" height="42" rx="21" fill="#0f1c33" stroke="#2a4a7a"/>
    <text x="76" y="179" fill="#38f0c8">Text&#160;&#160;<tspan fill="#ffffff">99.5% exact</tspan></text>

    <rect x="236" y="152" width="196" height="42" rx="21" fill="#0f1c33" stroke="#2a4a7a"/>
    <text x="256" y="179" fill="#5aa9ff">Grid&#160;&#160;<tspan fill="#ffffff">99.1% / 3 tries</tspan></text>
  </g>

  <circle cx="900" cy="204" r="5" fill="#38f0c8" filter="url(#glow)"/>
  <text x="880" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7f92b5" text-anchor="end">MIT licensed</text>
</svg>
