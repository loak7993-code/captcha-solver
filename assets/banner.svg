<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="CAPTCHA Solver - text OCR and image-grid selection, CPU-only">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070c18"/>
      <stop offset="45%"  stop-color="#0d1730"/>
      <stop offset="100%" stop-color="#0a2038"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38f0c8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38f0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5aa9ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38f0c8"/>
      <stop offset="100%" stop-color="#57b0ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38f0c8"/>
      <stop offset="65%"  stop-color="#57b0ff"/>
      <stop offset="100%" stop-color="#57b0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#121c33"/>
      <stop offset="100%" stop-color="#0c1526"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#2b446f"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#dots)" opacity="0.45"/>
  <circle cx="1010" cy="60" r="190" fill="url(#blobB)" filter="url(#soft)"/>
  <circle cx="150" cy="310" r="170" fill="url(#blobA)" filter="url(#soft)"/>
  <rect width="1200" height="340" rx="20" fill="none" stroke="#20355c" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="58" y="100" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="600" fill="#6f88b0" letter-spacing="3">CPU-ONLY&#160;&#160;&#183;&#160;&#160;NO THIRD-PARTY SERVICES</text>

  <!-- title (kept well clear of the cards) -->
  <text x="56" y="168" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-0.5">CAPTCHA <tspan fill="url(#accent)">SOLVER</tspan></text>

  <rect x="58" y="186" width="452" height="4" rx="2" fill="url(#rule)"/>

  <!-- subtitle -->
  <text x="58" y="222" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="18" fill="#9db1d2">Text OCR + image-grid selection, trained and served locally.</text>

  <!-- stat pills -->
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="56" y="250" width="172" height="42" rx="21" fill="#0e1a30" stroke="#26456f"/>
    <text x="76" y="277" fill="#38f0c8">99.5%<tspan fill="#e8eefb"> text exact</tspan></text>

    <rect x="240" y="250" width="208" height="42" rx="21" fill="#0e1a30" stroke="#26456f"/>
    <text x="260" y="277" fill="#57b0ff">99.1%<tspan fill="#e8eefb"> grid / 3 tries</tspan></text>

    <rect x="460" y="250" width="88" height="42" rx="21" fill="#0e1a30" stroke="#26456f"/>
    <text x="480" y="277" fill="#8aa0c4">MIT</text>
  </g>

  <!-- ============ card A: TEXT OCR ============ -->
  <g>
    <rect x="656" y="46" width="242" height="248" rx="16" fill="url(#card)" stroke="#22375e" stroke-width="1.4"/>
    <text x="682" y="78" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
          font-size="12.5" font-weight="700" fill="#7f92b5" letter-spacing="2.6">TEXT OCR</text>

    <!-- distorted character sample -->
    <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="42" font-weight="700">
      <text x="686" y="166" fill="#ffffff" transform="rotate(-9 686 166)">a</text>
      <text x="725" y="166" fill="#dfe9fb" transform="rotate(7 725 166)">7</text>
      <text x="764" y="166" fill="#ffffff" transform="rotate(-5 764 166)">K</text>
      <text x="803" y="166" fill="#dfe9fb" transform="rotate(10 803 166)">q</text>
      <text x="842" y="166" fill="#ffffff" transform="rotate(-8 842 166)">9</text>
    </g>
    <!-- interference lines -->
    <g stroke="#2f4a74" stroke-width="1.5" opacity="0.9" fill="none">
      <line x1="686" y1="188" x2="864" y2="142"/>
      <line x1="686" y1="142" x2="866" y2="188"/>
    </g>

    <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
      <circle cx="684" cy="243" r="4.5" fill="#38f0c8" filter="url(#glow)"/>
      <text x="698" y="249" font-size="21" font-weight="800" fill="#38f0c8">99.5%</text>
      <text x="682" y="274" font-size="12.5" fill="#7f92b5">exact match, hard tier</text>
    </g>
  </g>

  <!-- ============ card B: IMAGE GRID ============ -->
  <g>
    <rect x="914" y="46" width="242" height="248" rx="16" fill="url(#card)" stroke="#22375e" stroke-width="1.4"/>
    <text x="940" y="78" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
          font-size="12.5" font-weight="700" fill="#7f92b5" letter-spacing="2.6">IMAGE GRID</text>

    <!-- 3x3 tiles, three selected -->
    <g>
      <rect x="972" y="98"  width="36" height="36" rx="7" fill="#1b2c49" stroke="#38f0c8" stroke-width="2.4"/>
      <rect x="1017" y="98"  width="36" height="36" rx="7" fill="#16233c" stroke="#243a5f"/>
      <rect x="1062" y="98"  width="36" height="36" rx="7" fill="#16233c" stroke="#243a5f"/>

      <rect x="972" y="143" width="36" height="36" rx="7" fill="#16233c" stroke="#243a5f"/>
      <rect x="1017" y="143" width="36" height="36" rx="7" fill="#1b2c49" stroke="#38f0c8" stroke-width="2.4"/>
      <rect x="1062" y="143" width="36" height="36" rx="7" fill="#16233c" stroke="#243a5f"/>

      <rect x="972" y="188" width="36" height="36" rx="7" fill="#16233c" stroke="#243a5f"/>
      <rect x="1017" y="188" width="36" height="36" rx="7" fill="#1b2c49" stroke="#38f0c8" stroke-width="2.4"/>
      <rect x="1062" y="188" width="36" height="36" rx="7" fill="#16233c" stroke="#243a5f"/>
    </g>

    <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
      <circle cx="942" cy="243" r="4.5" fill="#57b0ff" filter="url(#glow)"/>
      <text x="956" y="249" font-size="21" font-weight="800" fill="#57b0ff">99.1%</text>
      <text x="940" y="274" font-size="12.5" fill="#7f92b5">within 3 tries</text>
    </g>
  </g>
</svg>
