<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" role="img" aria-label="Measured accuracy">
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38f0c8"/><stop offset="100%" stop-color="#2bd6a8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5aa9ff"/><stop offset="100%" stop-color="#3d7de0"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8aa0c4"/><stop offset="100%" stop-color="#6b7fa3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="212" rx="14" fill="#0e1526" stroke="#22345c" stroke-width="1.5"/>
  <text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Measured accuracy</text>
  <text x="24" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7f92b5">held-out test sets &#183; exact match</text>

  <!-- row 1 -->
  <text x="24" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4ec">Text CAPTCHA &#8212; hard tier</text>
  <rect x="250" y="82" width="320" height="18" rx="9" fill="#1a2540"/>
  <rect x="250" y="82" width="318.4" height="18" rx="9" fill="url(#bar1)"/>
  <text x="584" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38f0c8">99.5%</text>

  <!-- row 2 -->
  <text x="24" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4ec">Image grid &#8212; within 3 tries</text>
  <rect x="250" y="124" width="320" height="18" rx="9" fill="#1a2540"/>
  <rect x="250" y="124" width="317.1" height="18" rx="9" fill="url(#bar2)"/>
  <text x="584" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5aa9ff">99.1%</text>

  <!-- baseline row -->
  <text x="24" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7f92b5">Tesseract baseline &#8212; hard tier</text>
  <rect x="250" y="166" width="320" height="18" rx="9" fill="#1a2540"/>
  <rect x="250" y="166" width="9.6" height="18" rx="9" fill="url(#bar3)"/>
  <text x="584" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8aa0c4">3.0%</text>
</svg>
